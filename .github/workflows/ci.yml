name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: job_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/job_tracker_test
      DATABASE_INTEGRATION_URL: postgresql://postgres:postgres@localhost:5432/job_tracker_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure lean-spec binary is executable
        run: find node_modules -path "*leanspec*cli-linux-x64*" -name "lean-spec" -exec chmod +x {} \;

      - name: Validate LeanSpec (specs/)
        run: pnpm leanspec:validate

      - name: Spec indices synced
        run: pnpm leanspec:sync-spec-indices -- --check

      - name: Lint
        run: pnpm turbo lint

      - name: Assert clean tree after lint (no uncommitted autofix drift)
        run: git diff --exit-code

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Write API .env for CI
        run: |
          cat > apps/api/.env << 'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/job_tracker_test
          PORT=3101
          GOOGLE_CLIENT_ID=ci-dummy
          GOOGLE_CLIENT_SECRET=ci-dummy
          JWT_ACCESS_SECRET=ci-dummy-access
          JWT_REFRESH_SECRET=ci-dummy-refresh
          WEB_URL=http://localhost:3100
          AUTH_BYPASS_ENABLED=true
          DEV_AUTH_BYPASS_EMAIL=ci@test.local
          EOF

      - name: Test
        run: pnpm turbo test -- --coverage --coverage.thresholds.lines=80

      - name: Build
        run: pnpm turbo build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: job_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write API .env for CI
        run: |
          cat > apps/api/.env << 'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/job_tracker
          PORT=3101
          GOOGLE_CLIENT_ID=ci-dummy
          GOOGLE_CLIENT_SECRET=ci-dummy

          JWT_ACCESS_SECRET=ci-dummy-access
          JWT_REFRESH_SECRET=ci-dummy-refresh
          WEB_URL=http://localhost:3100
          AUTH_BYPASS_ENABLED=true
          DEV_AUTH_BYPASS_EMAIL=ci@test.local
          EOF

      - name: Run migrations (seed source DB for clone)
        run: pnpm --filter @job-tracker/api run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/job_tracker

      - name: Install Playwright Chromium
        run: pnpm --filter @job-tracker/web exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm e2e
        env:
          CI: true

  docker-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -f apps/api/Dockerfile -t job-tracker-api:ci .
