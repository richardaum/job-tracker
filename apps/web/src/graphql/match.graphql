query MatchAnalysesList {
  matchAnalyses {
    id
    jobId
    resumeId
    generationMetadata {
      status
      error
      timestamp
    }
    scoreRatio
    classification
    matchCount
    gapCount
    unclearCount
    createdAt
    updatedAt
    job {
      id
      title
      company {
        id
        name
      }
    }
  }
}

query Match($id: ID!) {
  match(id: $id) {
    id
    jobId
    resumeId
    generationMetadata {
      status
      error
      timestamp
    }
    scoreRatio
    classification
    matchCount
    gapCount
    unclearCount
    items {
      requirement
      source
      weight
      type
      verdict
      jdQuote
      sourceQuotes
      suggestion
    }
    createdAt
    job {
      id
      title
      company {
        id
        name
      }
    }
  }
}

query JobMatch($jobId: ID!) {
  jobMatch(jobId: $jobId) {
    id
    jobId
    resumeId
    generationMetadata {
      status
      error
      timestamp
    }
    scoreRatio
    classification
    matchCount
    gapCount
    unclearCount
    items {
      requirement
      source
      weight
      type
      verdict
      jdQuote
      sourceQuotes
      suggestion
    }
    createdAt
  }
}

mutation GenerateJobMatch($input: GenerateMatchInput!) {
  generateJobMatch(input: $input) {
    id
    jobId
    resumeId
    generationMetadata {
      status
      error
      timestamp
    }
    scoreRatio
    classification
    matchCount
    gapCount
    unclearCount
    items {
      requirement
      source
      weight
      type
      verdict
      jdQuote
      sourceQuotes
      suggestion
    }
    createdAt
  }
}

mutation DeleteMatchAnalysis($id: ID!) {
  deleteMatchAnalysis(id: $id) {
    success
    deletedId
  }
}
