query Settings {
  settings {
    id
    autoFillEnabled
    autoSummaryEnabled
    autoMatchEnabled
    duplicateWindowDays
    blockedKeywords {
      keyword
      scope
      matchMode
    }
    blockedCompanies
  }
}

mutation UpdateSettings($input: UpdateSettingsInput!) {
  updateSettings(input: $input) {
    id
    autoFillEnabled
    autoSummaryEnabled
    autoMatchEnabled
    duplicateWindowDays
    blockedKeywords {
      keyword
      scope
      matchMode
    }
    blockedCompanies
  }
}
