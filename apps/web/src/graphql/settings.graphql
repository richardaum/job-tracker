query Settings {
  settings {
    id
    autoFillEnabled
    autoSummaryEnabled
    autoMatchEnabled
    aiEnabled
    hasOpenAiKey
    duplicateWindowDays
    trialCallsUsed
    trialCallsLimit
    lastQuickTipId
    dismissedQuickTipIds
    blockedKeywords {
      keyword
      scope
      matchMode
    }
    blockedCompanies
  }
}

mutation UpdateSettings($input: UpdateSettingsInput!) {
  updateSettings(input: $input) {
    id
    autoFillEnabled
    autoSummaryEnabled
    autoMatchEnabled
    aiEnabled
    hasOpenAiKey
    duplicateWindowDays
    trialCallsUsed
    trialCallsLimit
    lastQuickTipId
    dismissedQuickTipIds
    blockedKeywords {
      keyword
      scope
      matchMode
    }
    blockedCompanies
  }
}

mutation SaveOpenAiKey($key: String!) {
  saveOpenAiKey(key: $key) {
    id
    aiEnabled
    hasOpenAiKey
    trialCallsUsed
    trialCallsLimit
  }
}

mutation RemoveOpenAiKey {
  removeOpenAiKey {
    id
    aiEnabled
    hasOpenAiKey
    trialCallsUsed
    trialCallsLimit
  }
}

subscription AiUsageChanged {
  aiUsageChanged {
    trialCallsUsed
    hasOpenAiKey
  }
}
