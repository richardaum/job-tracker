query DraftJobsList {
  draftJobs {
    id
    jobId
    url
    title
    conversionMetadata {
      status
      error
      timestamp
    }
    createdAt
  }
}

query DraftJobDetail($id: ID!) {
  draftJob(id: $id) {
    id
    jobId
    url
    title
    htmlContent
    conversionMetadata {
      status
      error
      timestamp
    }
    createdAt
    match {
      id
      jobId
      draftJobId
      resumeId
      generationMetadata {
        status
        error
        timestamp
      }
      scoreRatio
      classification
      matchCount
      gapCount
      unclearCount
      createdAt
    }
  }
}

mutation DeleteDraftJob($id: ID!, $deleteLinkedJob: Boolean) {
  deleteDraftJob(id: $id, deleteLinkedJob: $deleteLinkedJob) {
    success
    deletedId
  }
}

mutation DeleteJobsForDraft($draftId: ID!) {
  deleteJobsForDraft(draftId: $draftId) {
    success
    deletedId
  }
}

mutation CreateJobWithAI($draftId: ID!) {
  createJobWithAI(draftId: $draftId) {
    id
    title
    conversionMetadata {
      status
      error
    }
  }
}

mutation CreateDraftJob($input: CreateDraftJobInput!) {
  createDraftJob(input: $input) {
    id
    jobId
    url
    title
    conversionMetadata {
      status
      error
    }
  }
}

mutation UpdateDraftJob($id: ID!, $input: UpdateDraftJobInput!) {
  updateDraftJob(id: $id, input: $input) {
    id
    jobId
    url
    title
    conversionMetadata {
      status
      error
    }
  }
}
