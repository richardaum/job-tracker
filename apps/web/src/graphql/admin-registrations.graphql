query AdminRegistrations {
  registrations {
    id
    email
    name
    avatarUrl
    status
    createdAt
  }
}

mutation ApproveRegistration($userId: ID!) {
  approveRegistration(userId: $userId) {
    id
    status
  }
}

mutation RejectRegistration($userId: ID!) {
  rejectRegistration(userId: $userId) {
    id
    status
  }
}
