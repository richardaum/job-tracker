fragment JobSalarySelection on JobType {
  salary {
    minCents
    maxCents
    currency
    period
  }
}

query Jobs($filter: ApplicationQuickFilter, $company: String, $runId: ID) {
  jobs(filter: $filter, company: $company, runId: $runId) {
    id
    title
    companyId
    company {
      id
      name
      description
    }
    description
    urls
    source
    ...JobSalarySelection
    tags
    location
    workRegion
    sourceRunId
    summary
    summaryMetadata {
      status
      error
      timestamp
    }
    fillMetadata {
      status
      error
      timestamp
    }
    currentStage
    currentStageReason
    currentStageAt
    createdAt
    match {
      id
      resumeId
      scoreRatio
      classification
      matchCount
      gapCount
      unclearCount
      generationMetadata {
        status
        error
        timestamp
      }
    }
  }
}

query Job($id: ID!) {
  job(id: $id) {
    id
    title
    companyId
    company {
      id
      name
      description
    }
    description
    urls
    source
    ...JobSalarySelection
    tags
    location
    workRegion
    sourceRunId
    summary
    summaryMetadata {
      status
      error
      timestamp
    }
    fillMetadata {
      status
      error
      timestamp
    }
    htmlContent
    currentStage
    currentStageReason
    currentStageAt
    createdAt
    match {
      id
      resumeId
      scoreRatio
      classification
      matchCount
      gapCount
      unclearCount
      generationMetadata {
        status
        error
        timestamp
      }
    }
  }
}

mutation CreateJob($input: CreateJobInput!) {
  createJob(input: $input) {
    id
    title
    companyId
    company {
      id
      name
      description
    }
    description
    urls
    source
    ...JobSalarySelection
    tags
    location
    workRegion
    createdAt
  }
}

