mutation UpdateCompany($id: ID!, $input: UpdateCompanyInput!) {
  updateCompany(id: $id, input: $input) {
    id
    name
    description
  }
}

mutation DeleteCompany($id: ID!) {
  deleteCompany(id: $id) {
    success
    deletedId
  }
}

query CompanyJobsCount($id: ID!) {
  companyJobsCount(id: $id)
}

query Companies {
  companies {
    id
    name
    description
  }
}

query Company($id: ID!) {
  company(id: $id) {
    id
    name
    description
  }
}
