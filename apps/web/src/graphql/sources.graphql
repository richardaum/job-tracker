mutation RerunSourceTemplate($templateId: ID!) {
  rerunSourceTemplate(templateId: $templateId) {
    id
    status
    startedAt
    surfaceUrl
    planId
  }
}

subscription SourceRunEvents {
  sourceRunEvents {
    type
    occurredAt
    run {
      id
      templateId
      status
      errorMessage
    }
  }
}

mutation ClearSourceTemplateRuns($templateId: ID!, $deleteJobs: Boolean = false) {
  clearSourceTemplateRuns(templateId: $templateId, deleteJobs: $deleteJobs)
}

mutation DeleteSourceRun($id: ID!, $deleteJobs: Boolean = false) {
  deleteSourceRun(id: $id, deleteJobs: $deleteJobs) {
    success
    deletedId
  }
}

query SourceTemplate($id: ID!) {
  sourceTemplate(id: $id) {
    id
    planId
    scheduleCron
    scheduleEnabled
    surfaceUrl
    createdAt
    runs {
      id
      status
      errorMessage
      startedAt
    }
  }
}

query SourceTemplatesAll {
  sourceTemplates {
    id
    planId
    scheduleCron
    scheduleEnabled
    surfaceUrl
    createdAt
    runs {
      id
      status
      errorMessage
      startedAt
    }
  }
}

mutation UpdateSourceTemplate($id: ID!, $input: UpdateSourceTemplateInput!) {
  updateSourceTemplate(id: $id, input: $input) {
    id
    planId
    scheduleCron
    scheduleEnabled
    surfaceUrl
    createdAt
    runs {
      id
      status
      errorMessage
      startedAt
    }
  }
}

mutation DeleteSourceTemplate($id: ID!) {
  deleteSourceTemplate(id: $id) {
    success
    deletedId
  }
}

mutation CreateSourceTemplate($input: CreateSourceTemplateInput!) {
  createSourceTemplate(input: $input) {
    id
    planId
    surfaceUrl
    scheduleCron
    scheduleEnabled
    createdAt
  }
}

query Plans {
  plans {
    id
    displayName
    templates {
      id
      surfaceUrl
      createdAt
      runs {
        id
        status
        errorMessage
        startedAt
      }
    }
  }
}

query Plan($id: ID!) {
  plan(id: $id) {
    id
    displayName
    document
    createdAt
    updatedAt
    templates {
      id
      planId
      surfaceUrl
      scheduleCron
      scheduleEnabled
      createdAt
      runs {
        id
        status
        errorMessage
        startedAt
      }
    }
  }
}

mutation UpdatePlan($id: ID!, $input: UpdatePlanInput!) {
  updatePlan(id: $id, input: $input) {
    id
    displayName
    document
    updatedAt
  }
}

mutation CreatePlan($input: CreatePlanInput!) {
  createPlan(input: $input) {
    id
    displayName
    document
    createdAt
    updatedAt
  }
}
