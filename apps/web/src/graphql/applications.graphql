fragment ApplicationSalarySelection on ApplicationType {
  salary {
    minCents
    maxCents
    currency
    period
  }
}

query Applications(
  $filter: ApplicationQuickFilter
  $company: String
  $runId: ID
) {
  applications(filter: $filter, company: $company, runId: $runId) {
    id
    title
    companyId
    company {
      id
      name
      description
    }
    description
    urls
    source
    ...ApplicationSalarySelection
    tags
    location
    workRegion
    sourceRunId
    currentStage
    currentStageReason
    currentStageAt
    createdAt
    fit {
      id
      scoreRatio
      classification
      fitCount
      gapCount
      unclearCount
      status
      error
    }
  }
}

query Application($id: ID!) {
  application(id: $id) {
    id
    title
    companyId
    company {
      id
      name
      description
    }
    description
    urls
    source
    ...ApplicationSalarySelection
    tags
    location
    workRegion
    sourceRunId
    currentStage
    currentStageReason
    currentStageAt
    createdAt
    fit {
      id
      scoreRatio
      classification
      fitCount
      gapCount
      unclearCount
      status
      error
    }
  }
}

mutation CreateApplication($input: CreateApplicationInput!) {
  createApplication(input: $input) {
    id
    title
    companyId
    company {
      id
      name
      description
    }
    description
    urls
    source
    ...ApplicationSalarySelection
    tags
    location
    workRegion
    createdAt
  }
}

query GenerateCompanyDescription($companyName: String!) {
  generateCompanyDescription(companyName: $companyName)
}

mutation UpdateApplication($id: ID!, $input: UpdateApplicationInput!) {
  updateApplication(id: $id, input: $input) {
    id
    title
    companyId
    company {
      id
      name
      description
    }
    description
    urls
    source
    ...ApplicationSalarySelection
    tags
    location
    workRegion
    createdAt
  }
}

mutation RemoveApplicationTag($id: ID!, $tag: String!) {
  removeApplicationTag(id: $id, tag: $tag) {
