query Applications {
  applications {
    id
    title
    company
    description
    url
    salaryMinCents
    salaryMaxCents
    salaryCurrency
    salaryPeriod
    tags
    createdAt
  }
}

query Application($id: ID!) {
  application(id: $id) {
    id
    title
    company
    description
    url
    salaryMinCents
    salaryMaxCents
    salaryCurrency
    salaryPeriod
    tags
    createdAt
  }
}

mutation CreateApplication($input: CreateApplicationInput!) {
  createApplication(input: $input) {
    id
    title
    company
    description
    url
    salaryMinCents
    salaryMaxCents
    salaryCurrency
    salaryPeriod
    tags
    createdAt
  }
}

mutation UpdateApplication($id: ID!, $input: UpdateApplicationInput!) {
  updateApplication(id: $id, input: $input) {
    id
    title
    company
    description
    url
    salaryMinCents
    salaryMaxCents
    salaryCurrency
    salaryPeriod
    tags
    createdAt
  }
}

mutation DeleteApplication($id: ID!) {
  deleteApplication(id: $id)
}

