query Applications($filter: ApplicationQuickFilter) {
  applications(filter: $filter) {
    id
    title
    companyId
    company {
      id
      name
      description
    }
    description
    url
    salaryMinCents
    salaryMaxCents
    salaryCurrency
    salaryPeriod
    tags
    currentStage
    currentStageReason
    currentStageAt
    createdAt
  }
}

query Application($id: ID!) {
  application(id: $id) {
    id
    title
    companyId
    company {
      id
      name
      description
    }
    description
    url
    salaryMinCents
    salaryMaxCents
    salaryCurrency
    salaryPeriod
    tags
    currentStage
    currentStageReason
    currentStageAt
    createdAt
  }
}

mutation CreateApplication($input: CreateApplicationInput!) {
  createApplication(input: $input) {
    id
    title
    companyId
    company {
      id
      name
      description
    }
    description
    url
    salaryMinCents
    salaryMaxCents
    salaryCurrency
    salaryPeriod
    tags
    createdAt
