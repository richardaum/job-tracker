fragment ApplicationSalarySelection on ApplicationType {
  salary {
    minCents
    maxCents
    currency
    period
  }
}

query Applications($filter: ApplicationQuickFilter, $company: String) {
  applications(filter: $filter, company: $company) {
    id
    title
    companyId
    company {
      id
      name
      description
    }
    description
    urls
    source
    ...ApplicationSalarySelection
    tags
    currentStage
    currentStageReason
    currentStageAt
    createdAt
  }
}

query Application($id: ID!) {
  application(id: $id) {
    id
    title
    companyId
    company {
      id
      name
      description
    }
    description
    urls
    source
    ...ApplicationSalarySelection
    tags
    currentStage
    currentStageReason
    currentStageAt
    createdAt
  }
}

mutation CreateApplication($input: CreateApplicationInput!) {
  createApplication(input: $input) {
    id
    title
    companyId
    company {
      id
      name
      description
    }
    description
    urls
    source
    ...ApplicationSalarySelection
    tags
    createdAt
  }
}

mutation CreateApplicationWithAi($input: CreateApplicationWithAIInput!) {
  createApplicationWithAI(input: $input) {
    id
    title
    companyId
    company {
      id
      name
      description
    }
    description
    urls
    source
    ...ApplicationSalarySelection
    tags
    createdAt
  }
}

query GenerateApplicationDraftWithAi($input: CreateApplicationWithAIInput!) {
  generateApplicationDraftWithAI(input: $input) {
    title
    company
    description
    url
    salaryMinCents
    salaryMaxCents
    salaryCurrency
    salaryPeriod
    tags
    noteContents
