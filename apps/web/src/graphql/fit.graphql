query FitAnalysesList {
  fitAnalyses {
    id
    applicationId
    draftApplicationId
    resumeId
    status
    error
    scoreRatio
    classification
    fitCount
    gapCount
    unclearCount
    createdAt
    updatedAt
    application {
      id
      title
      company {
        id
        name
      }
    }
    draftApplication {
      id
      title
    }
  }
}

query Fit($id: ID!) {
  fit(id: $id) {
    id
    applicationId
    draftApplicationId
    resumeId
    status
    error
    scoreRatio
    classification
    fitCount
    gapCount
    unclearCount
    items {
      requirement
      source
      weight
      type
      verdict
      jdQuote
      sourceQuotes
      suggestion
    }
    createdAt
  }
}

